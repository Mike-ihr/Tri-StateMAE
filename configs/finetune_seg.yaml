seed: 42
device: null

distributed:
  enabled: True
  num_gpus: 3
  visible_cuda: "1,2,3"
  backend: nccl

data:
  root: /root/data/BraTS2021
  classification_csv: null
  image_size: [155, 240, 240]
  train_cases: 1000
  val_cases: 125
  test_cases: 126
  missing_modalities: []

model:
  in_chans: 4
  out_chans: 3
  image_size: [155, 240, 240]
  patch_size: [16, 16, 16]
  embed_dim: 768
  depth: 12
  heads: 12

training:
  epochs: 100
  warmup_epochs: 0
  batch_size: 4
  num_workers: 8
  lr: 1.0e-4
  weight_decay: 0.05
  clip_grad: 1.0
  pretrained: outputs/pretrain_tristate/ablations/alpha7beta1gamma2/pretrain_last.pt
  output_dir: outputs/finetune_seg/ablations/alpha7beta1gamma2
